# SPA fallback: let react-router handle client-side routes (deep links like
# /groups/3/balances) instead of returning 404. API calls are proxied to the
# backend container when running behind docker-compose.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Mirror the Vite dev proxy: strip the leading /api so unprefixed
        # backend routes (/auth, /groups, /friends) resolve. Backend routes
        # that genuinely live under /api (balances, expenses) keep theirs.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:5000;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
